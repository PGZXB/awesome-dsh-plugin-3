name: Refresh snapshot and review queue

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Raw data only: fetch the topic snapshot and refresh the review queue.
      # CATALOG.md / TOP200.md are intentionally NOT regenerated here — they
      # only change via scripts/merge.mjs after the maintainer has reviewed
      # data/review/pending.md and recorded decisions in data/approved.json /
      # data/curated.json. See data/review/README.md.
      - name: Refresh snapshot and review queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Snapshot and review queue are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repositories.json data/review
          git commit -m "data: refresh dsh-plugin snapshot and review queue"
          git push
